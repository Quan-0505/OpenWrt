# Reusable workflow for building OpenWrt firmware
name: OpenWrt-Matrix

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
        default: ""
      upload_source:
        required: false
        type: boolean
        default: false
      build_firmware:
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      targets:
        description: "Select target platforms (comma separated, e.g. R2S,R3S,R4S,X86 ;leave blank for all, case-insensitive)"
        required: false
        type: string
        default: ""
      upload_source:
        description: "Upload source folder before build"
        required: false
        type: boolean
        default: false
      build_firmware:
        description: "Build and publish firmware"
        required: false
        type: boolean
        default: true

jobs:
  setup:
    runs-on: self-hosted
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - id: set-matrix
        shell: bash
        run: |
          # All possible targets
          all_targets='[
            {"name": "R2S", "script_dir": "R2S", "arch": "rockchip/armv8", "arch_suffix": "3328"},
            {"name": "R3S", "script_dir": "R4S", "arch": "rockchip/armv8", "arch_suffix": "3566"},
            {"name": "R4S", "script_dir": "R4S", "arch": "rockchip/armv8", "arch_suffix": "3399"},
            {"name": "X86", "script_dir": "X86", "arch": "x86/64", "arch_suffix": ""}
          ]'

          # User selected targets
          inputs_targets="${{ inputs.targets }}"
          # Replace Chinese comma with English comma, convert to uppercase
          inputs_targets=$(echo "$inputs_targets" | sed 's/，/,/g' | tr 'a-z' 'A-Z' | xargs)

          if [[ -z "$inputs_targets" ]]; then
            # If input is empty, run all targets
            echo "matrix=$(echo "$all_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          else
            # Filter targets based on input
            filtered_targets=$(echo "$all_targets" | jq --arg targets "$inputs_targets" '[.[] | select(.name as $name | ($targets | split(",") | map(gsub(" "; "")) | index($name))) ]')
            echo "matrix=$(echo "$filtered_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          fi
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build:
    needs: setup
    env: # default values, will be overridden later
      seed: dummy
      artifact_prefix: dummy
      sha_match: dummy
      ext4_zip: dummy
      sfs_zip: dummy
      sysupgrade_glob: dummy
      openwrt_source_name: dummy
      TARGET_DEVICE_ARCH: dummy
      latest_release: dummy
      KIXDNS_RELEASE_TAG: dummy

    runs-on: self-hosted
    container:
      image: localhost:5000/ow-build:debian13
      options: --volume /build/owcache:/owcache
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Generate platform variables and print
        id: genvars
        run: |
          # Debug: Print all input variables
          echo "inputs.targets: '${{ inputs.targets }}'"
          echo "inputs.upload_source: '${{ inputs.upload_source }}'"
          echo "inputs.build_firmware: '${{ inputs.build_firmware }}'"
          echo "matrix.name: '${{ matrix.name }}'"
          echo "matrix.script_dir: '${{ matrix.script_dir }}'"
          echo "matrix.arch: '${{ matrix.arch }}'"
          echo "matrix.arch_suffix: '${{ matrix.arch_suffix }}'"
          echo "github.run_id: '${{ github.run_id }}'"

          # Platform name in lowercase
          name_lower=$(echo "${{ matrix.name }}" | tr 'A-Z' 'a-z')

          # seed rule
          seed="${{ matrix.name }}"

          # artifact_prefix rule
          artifact_prefix="${{ matrix.name }}-OpenWrt"

          # sha_match rule
          sha_match="$name_lower"

          # ext4_zip/sfs_zip rule
          if [ "$name_lower" = "x86" ]; then
            ext4_zip='*ext4-combined*'
            sfs_zip='*squashfs-combined*'
            sysupgrade_glob='*combined-efi.img*'
          else
            ext4_zip="*$name_lower*ext4*"
            sfs_zip="*$name_lower*squashfs*"
            sysupgrade_glob='*sysupgrade.img*'
          fi

          # workerid variable
          workerid=${{ github.run_id }}

          # openwrt_source_name archive name
          openwrt_source_name="openwrt-source-${{ matrix.name }}-${workerid}.tar"

          # kixdns prebuilt release tag (JohnsonRan/luci-app-kixdns)
          kixdns_release_tag="v1.5.3"

          cat <<EOF | tee -a $GITHUB_ENV
          seed=$seed
          artifact_prefix=$artifact_prefix
          sha_match=$sha_match
          ext4_zip=$ext4_zip
          sfs_zip=$sfs_zip
          sysupgrade_glob=$sysupgrade_glob
          openwrt_source_name=$openwrt_source_name
          KIXDNS_RELEASE_TAG=$kixdns_release_tag
          EOF

      - name: Show system info
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo | grep 'model name'

      - name: Checkout
        uses: actions/checkout@main

      - name: Init build dependencies (no-op on self-hosted image)
        run: |
          git config --global user.name 'GitHub Actions' || true
          git config --global user.email 'noreply@github.com' || true
          df -h

      - name: Prepare Mixedwrt
        run: |
          sudo chown -R runner:runner "${{ github.workspace }}" || true
          cp -r ./SCRIPTS/${{ matrix.script_dir }}/. ./SCRIPTS/
          cp -r ./SCRIPTS/. ./
          /bin/bash 01_get_ready.sh

      - name: Prepare Package
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cp -r ../SCRIPTS/. ./
          /bin/bash 02_prepare_package.sh
          /bin/bash 02_target_only.sh
          /bin/bash 04_remove_upx.sh

      - name: Fetch KIXDNS prebuilt static binary
        run: |
          set -e
          if [ "${{ matrix.arch }}" = "x86/64" ]; then A=x86_64; else A=aarch64_generic; fi
          VER="${{ env.KIXDNS_RELEASE_TAG }}"
          curl -sSL -o /tmp/kix.tgz "https://github.com/JohnsonRan/luci-app-kixdns/releases/download/${VER}/kixdns_${A}-openwrt-24.10.tar.gz"
          mkdir -p /tmp/kix && tar -xzf /tmp/kix.tgz -C /tmp/kix
          cd openwrt
          python3 - <<'PYEOF'
          import gzip, io, tarfile, glob, os
          ipk = glob.glob('/tmp/kix/kixdns_*.ipk')[0]
          outer = tarfile.open(fileobj=io.BytesIO(gzip.decompress(open(ipk, 'rb').read())), mode='r:')
          data = outer.extractfile('./data.tar.gz').read()
          tf = tarfile.open(fileobj=io.BytesIO(gzip.decompress(data)), mode='r:')
          f = tf.extractfile('./usr/bin/kixdns')
          os.makedirs('package/new/kixdns/prebuilt', exist_ok=True)
          open('package/new/kixdns/prebuilt/kixdns', 'wb').write(f.read())
          PYEOF
          chmod +x package/new/kixdns/prebuilt/kixdns
          ls -lh package/new/kixdns/prebuilt/kixdns

      - name: Fetch daed (rust-daed v3.1.1-sticky apk payload)
        run: |
          set -e
          export DEV=$(echo "${{ matrix.name }}" | tr 'A-Z' 'a-z')
          python3 - <<'PYEOF'
          import gzip, io, tarfile, os, shutil, urllib.request
          dev = os.environ['DEV']
          tag = 'v3.1.1-sticky'
          url = 'https://github.com/Quan-0505/rust-daed/releases/download/' + tag + '/rust-daed-' + dev + '.apk'
          print('fetching', url)
          urllib.request.urlretrieve(url, '/tmp/daed.apk')
          raw = open('/tmp/daed.apk', 'rb').read()
          tf = tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw)), mode='r:')
          dst = os.path.join('openwrt', 'package', 'new', 'daed', 'prebuilt-data')
          if os.path.isdir(dst):
              shutil.rmtree(dst)
          for m in tf.getmembers():
              if m.name.startswith('usr/') or m.name.startswith('etc/'):
                  if m.isdir():
                      os.makedirs(os.path.join(dst, m.name), exist_ok=True)
                  elif m.isfile():
                      src = tf.extractfile(m)
                      p = os.path.join(dst, m.name)
                      os.makedirs(os.path.dirname(p), exist_ok=True)
                      with open(p, 'wb') as f:
                          f.write(src.read())
          # sanity
          b = os.path.join(dst, 'usr', 'bin', 'daed')
          print('payload daed bytes:', os.path.getsize(b))
          print('payload entries:', sum(len(fs) for _, _, fs in os.walk(dst)))
          # daemon serves the WebUI from /usr/share/daed/web by default; ship it
          web_src = os.path.join('PATCH', 'daed-web')
          web_dst = os.path.join(dst, 'usr', 'share', 'daed', 'web')
          shutil.copytree(web_src, web_dst)
          print('web assets copied:', sum(len(fs) for _, _, fs in os.walk(web_dst)))
          PYEOF
          ls -lh openwrt/package/new/daed/prebuilt-data/usr/bin/daed

      - name: QTMDFW4
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cp -rf ../SEED/${{ env.seed }}/config.seed .config

      - name: Convert Translation
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 03_convert_translation.sh
      - name: Add ACL
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 05_create_acl_for_luci.sh -a
      - name: Fix Permissions
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          sudo -E chmod -R 755 ./08_fix_permissions.sh
          /bin/bash 08_fix_permissions.sh

      - name: Make Config
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          make defconfig

      - name: Get Architecture
        id: getarch
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | awk -F '_' '{print $1}')"
          if [ -n "${{ matrix.arch_suffix }}" ]; then
            TARGET_DEVICE_ARCH="$TARGET_DEVICE_ARCH-${{ matrix.arch_suffix }}"
          fi
          echo "TARGET_DEVICE_ARCH=$TARGET_DEVICE_ARCH" >> $GITHUB_ENV
          latest_release="$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][5-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')"
          echo "latest_release=${latest_release}" >> $GITHUB_ENV

          echo "Package folder ${{ env.openwrt_source_name }}"
          cd ..
          # Must use tar, otherwise symbolic links will be incomplete
          if [ "${{ inputs.upload_source }}" = "true" ]; then
            tar -cf ${{ env.openwrt_source_name }} openwrt
          fi

      # upload_source
      - name: Upload Source Archive
        if: inputs.upload_source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.openwrt_source_name }}
          path: |
            ${{ env.openwrt_source_name }}
          retention-days: 5

      - name: Cache OpenWrt download sources (dl)
        if: inputs.build_firmware
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: yaof-dl-${{ env.latest_release }}-${{ env.TARGET_DEVICE_ARCH }}
          restore-keys: |
            yaof-dl-${{ env.latest_release }}-
            yaof-dl-

      - name: Restore persistent build cache (self-hosted /owcache)
        if: inputs.build_firmware
        run: |
          KEY=${{ matrix.name }}
          mkdir -p /owcache/"${KEY}" /owcache/dl
          for d in build_dir staging_dir; do
            if [ -d /owcache/"${KEY}/${d}" ]; then
              echo "restoring ${d}"
              mkdir -p "openwrt/${d}"
              rsync -a /owcache/"${KEY}/${d}"/ "openwrt/${d}/" || true
            fi
          done
          if [ -d /owcache/dl ] && [ "$(ls -A /owcache/dl | head -1)" ]; then
            echo "restoring shared dl"
            mkdir -p openwrt/dl
            rsync -a /owcache/dl/ openwrt/dl/ || true
          fi
          du -sh openwrt/dl openwrt/build_dir openwrt/staging_dir 2>/dev/null || true

      - name: Make Download
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          if [ "${{ inputs.upload_source }}" = "true" ] && [ -f ../${{ env.openwrt_source_name }} ]; then
            rm ../${{ env.openwrt_source_name }}
          fi
          make download -j$(( $(nproc) > 8 ? 8 : $(nproc) ))
          make -j$(( $(nproc) > 8 ? 8 : $(nproc) )) package/network/utils/nftables/refresh V=s

      # build_firmware
      - name: Compile Openwrt
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        id: compileopenwrt
        continue-on-error: true
        run: |
          IGNORE_ERRORS=1 make -j$(( $(nproc) > 8 ? 8 : $(nproc) ))
          echo $?
      - name: If Error
        if: steps.compileopenwrt.outcome == 'failure'
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cat ./.config
          echo '================================================================'
          make -j1 V=s

      - name: Organize files
        if: inputs.build_firmware
        id: organize
        env:
          LATEST_RELEASE: ${{ env.latest_release }}
        run: |
          rm -rf ./artifact/
          mkdir -p ./artifact/
          mv openwrt/bin/targets/${{ matrix.arch }}/${{ env.sysupgrade_glob }} ./artifact/ || true
          cd ./artifact/
          ls -Ahl
          gzip -d *.gz || true
          gzip --best *.img
          ls -Ahl
          sha256sum openwrt*${{ env.sha_match }}* | tee ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}.sha256sum
          zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-ext4.zip ${{ env.ext4_zip }}
          zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-sfs.zip ${{ env.sfs_zip }}
          ls -Ahl

      - name: Save persistent build cache (self-hosted /owcache)
        if: steps.organize.outcome == 'success'
        run: |
          KEY=${{ matrix.name }}
          mkdir -p /owcache/"${KEY}" /owcache/dl
          rsync -a openwrt/build_dir/ /owcache/"${KEY}"/build_dir/ || true
          rsync -a openwrt/staging_dir/ /owcache/"${KEY}"/staging_dir/ || true
          rsync -a openwrt/dl/ /owcache/dl/ || true
          du -sh /owcache/"${KEY}"/build_dir /owcache/"${KEY}"/staging_dir /owcache/dl 2>/dev/null || true

      - name: Upload firmware artifacts (safety net)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_prefix }}-firmware
          path: ./artifact/*.zip
          retention-days: 7

      - name: Clean stale release assets (this device)
        if: inputs.build_firmware
        env:
          PREFIX: ${{ env.artifact_prefix }}
          TAG: ${{ env.latest_release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          tok = os.environ['GITHUB_TOKEN']
          prefix = os.environ['PREFIX']
          tag = os.environ['TAG']
          def api(path, method='GET'):
              r = urllib.request.Request('https://api.github.com/repos/' + repo + path, method=method,
                  headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json',
                           'User-Agent': 'dsh'})
              with urllib.request.urlopen(r, timeout=60) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else None
          rel = api('/releases/tags/' + tag)
          if not rel:
              print('release not found, nothing to clean'); raise SystemExit(0)
          for a in rel['assets']:
              n = a['name']
              if n.startswith(prefix + '-') and n.endswith('.zip'):
                  print('deleting stale asset', n)
                  api('/releases/assets/%d' % a['id'], method='DELETE')
          PYEOF

      - name: Create release
        if: inputs.build_firmware
        id: create_release
        uses: ncipollo/release-action@main
        with:
          name: OpenWRT-${{ env.latest_release }}
          allowUpdates: true
          prerelease: false
          tag: ${{ env.latest_release }}
          commit: "25.12"
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ./artifact/*.zip

      - name: Print Disk Space After
        run: df -h
