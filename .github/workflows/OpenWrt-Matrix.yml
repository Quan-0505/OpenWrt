# Reusable workflow for building OpenWrt firmware
name: OpenWrt-Matrix

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
        default: ""
      upload_source:
        required: false
        type: boolean
        default: false
      build_firmware:
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      targets:
        description: "Select target platforms (comma separated, e.g. R2S,R3S,R4S,X86 ;leave blank for all, case-insensitive)"
        required: false
        type: string
        default: ""
      upload_source:
        description: "Upload source folder before build"
        required: false
        type: boolean
        default: false
      build_firmware:
        description: "Build and publish firmware"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - id: set-matrix
        shell: bash
        run: |
          # All possible targets
          all_targets='[
            {"name": "R2S", "script_dir": "R2S", "arch": "rockchip/armv8", "arch_suffix": "3328"},
            {"name": "R3S", "script_dir": "R4S", "arch": "rockchip/armv8", "arch_suffix": "3566"},
            {"name": "R4S", "script_dir": "R4S", "arch": "rockchip/armv8", "arch_suffix": "3399"},
            {"name": "X86", "script_dir": "X86", "arch": "x86/64", "arch_suffix": ""}
          ]'

          # User selected targets
          inputs_targets="${{ inputs.targets }}"
          # Replace Chinese comma with English comma, convert to uppercase
          inputs_targets=$(echo "$inputs_targets" | sed 's/，/,/g' | tr 'a-z' 'A-Z' | xargs)

          if [[ -z "$inputs_targets" ]]; then
            # If input is empty, run all targets
            echo "matrix=$(echo "$all_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          else
            # Filter targets based on input
            filtered_targets=$(echo "$all_targets" | jq --arg targets "$inputs_targets" '[.[] | select(.name as $name | ($targets | split(",") | map(gsub(" "; "")) | index($name))) ]')
            echo "matrix=$(echo "$filtered_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          fi
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build:
    needs: setup
    env: # default values, will be overridden later
      seed: dummy
      artifact_prefix: dummy
      sha_match: dummy
      ext4_zip: dummy
      sfs_zip: dummy
      sysupgrade_glob: dummy
      openwrt_source_name: dummy
      TARGET_DEVICE_ARCH: dummy
      latest_release: dummy
      KIXDNS_RELEASE_TAG: dummy

    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Generate platform variables and print
        id: genvars
        run: |
          # Debug: Print all input variables
          echo "inputs.targets: '${{ inputs.targets }}'"
          echo "inputs.upload_source: '${{ inputs.upload_source }}'"
          echo "inputs.build_firmware: '${{ inputs.build_firmware }}'"
          echo "matrix.name: '${{ matrix.name }}'"
          echo "matrix.script_dir: '${{ matrix.script_dir }}'"
          echo "matrix.arch: '${{ matrix.arch }}'"
          echo "matrix.arch_suffix: '${{ matrix.arch_suffix }}'"
          echo "github.run_id: '${{ github.run_id }}'"

          # Platform name in lowercase
          name_lower=$(echo "${{ matrix.name }}" | tr 'A-Z' 'a-z')

          # seed rule
          seed="${{ matrix.name }}"

          # artifact_prefix rule
          artifact_prefix="${{ matrix.name }}-OpenWrt"

          # sha_match rule
          sha_match="$name_lower"

          # ext4_zip/sfs_zip rule
          if [ "$name_lower" = "x86" ]; then
            ext4_zip='*ext4-combined*'
            sfs_zip='*squashfs-combined*'
            sysupgrade_glob='*combined-efi.img*'
          else
            ext4_zip="*$name_lower*ext4*"
            sfs_zip="*$name_lower*squashfs*"
            sysupgrade_glob='*sysupgrade.img*'
          fi

          # workerid variable
          workerid=${{ github.run_id }}

          # openwrt_source_name archive name
          openwrt_source_name="openwrt-source-${{ matrix.name }}-${workerid}.tar"

          # kixdns prebuilt release tag (JohnsonRan/luci-app-kixdns)
          kixdns_release_tag="v1.5.3"

          cat <<EOF | tee -a $GITHUB_ENV
          seed=$seed
          artifact_prefix=$artifact_prefix
          sha_match=$sha_match
          ext4_zip=$ext4_zip
          sfs_zip=$sfs_zip
          sysupgrade_glob=$sysupgrade_glob
          openwrt_source_name=$openwrt_source_name
          KIXDNS_RELEASE_TAG=$kixdns_release_tag
          EOF

      - name: Show system info
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo | grep 'model name'

      - name: Maximize build space
        if: inputs.build_firmware
        uses: smallprogram/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 4608
          root-reserve-mb: 3584
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Checkout
        uses: actions/checkout@main

      - name: Init build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo /bin/bash -c "$(curl -sL https://git.io/vokNn)"
          sudo -E apt-fast -y -qq install asciidoc bash bcc bin86 binutils bison bzip2 clang file flex g++ g++-multilib gawk gcc-multilib gettext git gzip help2man intltool libbpf-dev libboost-dev libelf-dev libncurses-dev libssl-dev libthread-queue-any-perl libusb-dev libxml-parser-perl linux-tools-generic llvm make patch perl-modules pkg-config python3-dev python3-pip python3-pyelftools python3-setuptools rsync sharutils swig time unzip util-linux wget xsltproc zlib1g-dev zip zstd
          sudo -E apt-fast -y -qq install dos2unix dwarves jq npm quilt
          sudo -E npm install -g pnpm
          sudo -E npm install -g n
          sudo -E n stable
          pip3 install --user -U pylibfdt --break-system-packages
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo -E git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
          sudo -E git config --global core.abbrev auto
          df -h

      - name: Prepare Mixedwrt
        run: |
          sudo chown -R runner:runner "${{ github.workspace }}"
          cp -r ./SCRIPTS/${{ matrix.script_dir }}/. ./SCRIPTS/
          cp -r ./SCRIPTS/. ./
          /bin/bash 01_get_ready.sh

      - name: Prepare Package
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cp -r ../SCRIPTS/. ./
          /bin/bash 02_prepare_package.sh
          /bin/bash 02_target_only.sh
          /bin/bash 04_remove_upx.sh

      - name: Fetch KIXDNS prebuilt static binary
        run: |
          set -e
          if [ "${{ matrix.arch }}" = "x86/64" ]; then A=x86_64; else A=aarch64_generic; fi
          VER="${{ env.KIXDNS_RELEASE_TAG }}"
          curl -sSL -o /tmp/kix.tgz "https://github.com/JohnsonRan/luci-app-kixdns/releases/download/${VER}/kixdns_${A}-openwrt-24.10.tar.gz"
          mkdir -p /tmp/kix && tar -xzf /tmp/kix.tgz -C /tmp/kix
          cd openwrt
          python3 - <<'PYEOF'
          import gzip, io, tarfile, glob, os
          ipk = glob.glob('/tmp/kix/kixdns_*.ipk')[0]
          outer = tarfile.open(fileobj=io.BytesIO(gzip.decompress(open(ipk, 'rb').read())), mode='r:')
          data = outer.extractfile('./data.tar.gz').read()
          tf = tarfile.open(fileobj=io.BytesIO(gzip.decompress(data)), mode='r:')
          f = tf.extractfile('./usr/bin/kixdns')
          os.makedirs('package/new/kixdns/prebuilt', exist_ok=True)
          open('package/new/kixdns/prebuilt/kixdns', 'wb').write(f.read())
          PYEOF
          chmod +x package/new/kixdns/prebuilt/kixdns
          ls -lh package/new/kixdns/prebuilt/kixdns

      - name: Fetch daed (rust-daed v3.1.1-sticky apk payload)
        if: matrix.name != 'R4S'
        run: |
          set -e
          export DEV=$(echo "${{ matrix.name }}" | tr 'A-Z' 'a-z')
          python3 - <<'PYEOF'
          import gzip, io, tarfile, os, shutil, urllib.request
          dev = os.environ['DEV']
          tag = 'v3.1.1-sticky'
          # 注意：固定取归档的 apk v2（<dev>-v2.apk）。canonical 资产在 2026-09-13 之后
          # 已重打包为 apk v3（ADB 容器，既不是 tar 也不是 gzip），这里用 tar 解不动。
          raw = None
          for name in ('rust-daed-%s-v2.apk' % dev, 'rust-daed-%s.apk' % dev):
              url = 'https://github.com/Quan-0505/rust-daed/releases/download/%s/%s' % (tag, name)
              print('fetching', url)
              try:
                  with urllib.request.urlopen(url, timeout=300) as resp:
                      cand = resp.read()
              except Exception as e:
                  print('  fetch failed:', e); continue
              if cand[:2] == b'\x1f\x8b':
                  raw = cand; print('  ok, gzip payload', len(cand), 'bytes'); break
              print('  skipped: not an apk v2 gzip payload (magic %s)' % cand[:4].hex())
          if raw is None:
              raise SystemExit('no apk v2 payload available for %s' % dev)
          tf = tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw)), mode='r:')
          dst = os.path.join('openwrt', 'package', 'new', 'daed', 'prebuilt-data')
          if os.path.isdir(dst):
              shutil.rmtree(dst)
          for m in tf.getmembers():
              if m.name.startswith('usr/') or m.name.startswith('etc/'):
                  if m.isdir():
                      os.makedirs(os.path.join(dst, m.name), exist_ok=True)
                  elif m.isfile():
                      src = tf.extractfile(m)
                      p = os.path.join(dst, m.name)
                      os.makedirs(os.path.dirname(p), exist_ok=True)
                      with open(p, 'wb') as f:
                          f.write(src.read())
          # sanity
          b = os.path.join(dst, 'usr', 'bin', 'daed')
          print('payload daed bytes:', os.path.getsize(b))
          print('payload entries:', sum(len(fs) for _, _, fs in os.walk(dst)))
          # daemon serves the WebUI from /usr/share/daed/web by default; ship it
          web_src = os.path.join('PATCH', 'daed-web')
          web_dst = os.path.join(dst, 'usr', 'share', 'daed', 'web')
          shutil.copytree(web_src, web_dst)
          print('web assets copied:', sum(len(fs) for _, _, fs in os.walk(web_dst)))
          PYEOF
          ls -lh openwrt/package/new/daed/prebuilt-data/usr/bin/daed

      - name: Select source-built DaeNext package for R4S
        if: matrix.name == 'R4S'
        run: |
          python3 SCRIPTS/test_daenext_toolchain.py
          cp PATCH/daenext-r4s/Makefile openwrt/package/new/daed/Makefile

      - name: QTMDFW4
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cp -rf ../SEED/${{ env.seed }}/config.seed .config

      - name: Convert Translation
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 03_convert_translation.sh
      - name: Add ACL
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 05_create_acl_for_luci.sh -a
      - name: Fix Permissions
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          sudo -E chmod -R 755 ./08_fix_permissions.sh
          /bin/bash 08_fix_permissions.sh

      - name: Make Config
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          make defconfig
          if [ "${{ matrix.name }}" = R4S ]; then
            grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config
            grep -q '^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set$' .config
            grep -q '^CONFIG_PACKAGE_daed=y$' .config
          fi

      - name: Get Architecture
        id: getarch
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | awk -F '_' '{print $1}')"
          if [ -n "${{ matrix.arch_suffix }}" ]; then
            TARGET_DEVICE_ARCH="$TARGET_DEVICE_ARCH-${{ matrix.arch_suffix }}"
          fi
          echo "TARGET_DEVICE_ARCH=$TARGET_DEVICE_ARCH" >> $GITHUB_ENV
          latest_release="$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][5-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')"
          echo "latest_release=${latest_release}" >> $GITHUB_ENV

          echo "Package folder ${{ env.openwrt_source_name }}"
          cd ..
          # Must use tar, otherwise symbolic links will be incomplete
          if [ "${{ inputs.upload_source }}" = "true" ]; then
            tar -cf ${{ env.openwrt_source_name }} openwrt
          fi

      # upload_source
      - name: Upload Source Archive
        if: inputs.upload_source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.openwrt_source_name }}
          path: |
            ${{ env.openwrt_source_name }}
          retention-days: 5

      - name: Cache OpenWrt download sources (dl)
        if: inputs.build_firmware
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: yaof-dl-${{ env.latest_release }}-${{ env.TARGET_DEVICE_ARCH }}
          restore-keys: |
            yaof-dl-${{ env.latest_release }}-
            yaof-dl-

      - name: Make Download
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          if [ "${{ inputs.upload_source }}" = "true" ] && [ -f ../${{ env.openwrt_source_name }} ]; then
            rm ../${{ env.openwrt_source_name }}
          fi
          make download -j50
          make -j$(($(nproc) + 1)) package/network/utils/nftables/refresh V=s

      # build_firmware
      - name: Install Rust for DaeNext R4S
        if: inputs.build_firmware && matrix.name == 'R4S'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install native build dependencies for DaeNext R4S
        if: inputs.build_firmware && matrix.name == 'R4S'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev qemu-user
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo install bpf-linker --version 0.10.3 --locked
          sudo npm install -g pnpm@10.24.0

      - name: Build OpenWrt toolchain for DaeNext R4S
        if: inputs.build_firmware && matrix.name == 'R4S'
        run: |
          set -euo pipefail
          make -C openwrt -j2 toolchain/install V=s

      - name: Build DaeNext and DaedNext 3.1.0 for R4S
        if: inputs.build_firmware && matrix.name == 'R4S'
        run: |
          set -euo pipefail
          bash SCRIPTS/build_daenext_r4s.sh

      - name: Compile Openwrt
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        id: compileopenwrt
        continue-on-error: true
        run: |
          if [ "${{ matrix.name }}" = R4S ]; then
            make -j$(($(nproc) + 1))
          else
            IGNORE_ERRORS=1 make -j$(($(nproc) + 1))
          fi
      - name: If Error
        if: steps.compileopenwrt.outcome == 'failure'
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cat ./.config
          echo '================================================================'
          make -j1 V=s

      - name: Verify R4S DaeNext image contents and kernel BTF
        if: inputs.build_firmware && matrix.name == 'R4S'
        run: |
          set -euo pipefail
          root=$(find openwrt/build_dir -type d -name root-rockchip -print -quit)
          test -n "$root"
          # R4S builds DaeNext from source, so the installed binary must NOT be byte-identical
          # to the prebuilt payload; assert it is a real aarch64 ELF with the product CLI instead.
          test -x "$root/usr/bin/daed"
          file "$root/usr/bin/daed" | grep -q 'ELF 64-bit.*ARM aarch64'
          strings -a "$root/usr/bin/daed" | grep -q 'daed run -c'
          test -x "$root/etc/init.d/daed"
          test -n "$(find "$root/etc/rc.d" -name '*daed' -print -quit)"
          python3 SCRIPTS/verify_daenext_assets.py "$root/usr/share/daed/web"
          # 固件必须带上 daed 数据面（netkit）所需的 fw4 放行规则，否则节点全部拨号失败
          test -s "$root/usr/share/nftables.d/chain-post/forward/30-daed-netkit.nft"
          test -s "$root/usr/share/nftables.d/chain-post/srcnat/30-daed-netkit.nft"
          grep -q '169.254.0.11' "$root/usr/share/nftables.d/chain-post/srcnat/30-daed-netkit.nft"
          echo 'netkit fw4 include present'
          # daed 的口子：没有 ip-full 就建不出 daens netns / dae0-dae0peer netkit，数据面不会 attach
          test -x "$root/usr/libexec/ip-full" || { echo 'ip-full missing in image (daed cannot create the netkit topology)'; exit 1; }
          # tc-full 同样装在 /usr/libexec/，/sbin/tc 是安装时才建立的 alternative 软链，构建根里没有
          test -x "$root/usr/libexec/tc-full" || { echo 'tc-full missing in image'; exit 1; }
          echo 'host tools present: ip-full + tc-full'
          # BTF evidence: scan every candidate vmlinux-ish artifact, print what each really is,
          # and accept the check when a real ELF carries a .BTF section (or a .btf side artifact exists).
          # 注意：必须排除 toolchain 自带的 linux 头文件目录，否则会误选到没有 BTF 配置的那份。
          kdir=$(find openwrt/build_dir -type d -path '*/linux-6.12*' -not -path '*toolchain*' -print -quit)
          test -n "$kdir"
          echo "kernel dir: $kdir"
          if grep -q '^CONFIG_DEBUG_INFO_BTF=y$' "$kdir/.config"; then
            echo 'CONFIG_DEBUG_INFO_BTF=y present'
          else
            echo 'WARN: CONFIG_DEBUG_INFO_BTF not in kernel .config'
          fi
          if grep -q '^CONFIG_DEBUG_INFO=y$' "$kdir/.config"; then
            echo 'CONFIG_DEBUG_INFO=y present'
          else
            echo 'WARN: CONFIG_DEBUG_INFO not in kernel .config'
          fi
          btf_ok=0
          for cand in $(find "$kdir" -maxdepth 1 \( -name 'vmlinux*' -o -name '*.btf*' -o -name '.tmp_vmlinux*' \) | sort); do
            echo "candidate: $cand"
            file "$cand" || true
            if readelf -h "$cand" >/dev/null 2>&1; then
              if readelf -S "$cand" 2>/dev/null | grep -q '\.BTF '; then
                echo "BTF section found in $cand"; btf_ok=1
              fi
            fi
          done
          test "$btf_ok" = 1

      - name: Ensure sysupgrade images carry metadata
        if: inputs.build_firmware
        run: |
          set -euo pipefail
          # 构建产物（含 .img.gz）末尾本来就由 OpenWrt 附了 JSON metadata——本步骤只是守卫：
          #   * 检测用“读尾部 4096 字节”：本版本的 fwtool 只支持 -S/-I，没有 -i
          #   * 只有确实缺失时才用 fwtool -I 补写（与 OpenWrt 的做法一致，追加在文件末尾）
          # 重要：metadata 位于文件末尾，任何 gunzip/regzip 都会把它丢掉——见 Organize 步骤的说明。
          board=""
          bjson=$(find openwrt/build_dir -maxdepth 4 -path '*root-*' -name board.json -print -quit || true)
          if [ -n "${bjson:-}" ]; then
            board=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));m=d.get('model') or {};print(m.get('id') or m.get('name') or '')" "$bjson" || true)
          fi
          echo "board: ${board:-<unknown>} (from ${bjson:-n/a})"
          fwtool=""
          mapfile -t imgs < <(find openwrt/bin/targets -type f \( -name '*sysupgrade.img' -o -name '*sysupgrade.img.gz' -o -name '*combined-efi.img' -o -name '*combined-efi.img.gz' \) | sort)
          test "${#imgs[@]}" -gt 0
          for f in "${imgs[@]}"; do
            echo "== $f"
            if tail -c 4096 "$f" | grep -q metadata_version; then
              echo '   metadata present (appended by the build)'
              continue
            fi
            echo '   metadata MISSING -> appending'
            if [ -z "$fwtool" ]; then
              # 必须用**主机版** fwtool：staging_dir/target-*/root-*/usr/bin/fwtool 是目标机
              # 二进制（musl/异架构），在 runner 上无法执行（cannot execute）
              for cand in openwrt/staging_dir/host/bin/fwtool openwrt/staging_dir/hostpkg/bin/fwtool; do
                [ -x "$cand" ] && { fwtool="$cand"; break; }
              done
            fi
            if [ -z "$fwtool" ]; then
              fwtool=$(find openwrt/staging_dir -type f -name fwtool -perm -u+x \
                -not -path '*/target-*' -not -path '*/root-*' -print -quit || true)
            fi
            test -x "${fwtool:-}" || { echo '   host fwtool not found under staging_dir'; exit 1; }
            echo "   using fwtool: $fwtool"
            python3 -c 'import json,sys; b=sys.argv[1]; print(json.dumps({"metadata_version":"1.1","compat_version":"1.0","supported_devices":([b] if b else []),"version":{"dist":"OpenWrt","version":sys.argv[2],"revision":sys.argv[3],"target":sys.argv[4],"board":b}},ensure_ascii=False))' "$board" "${{ env.latest_release }}" "${{ github.sha }}" "${{ matrix.arch }}" > /tmp/sysupgrade-meta.json
            cat /tmp/sysupgrade-meta.json; echo
            "$fwtool" -I /tmp/sysupgrade-meta.json "$f"
            tail -c 4096 "$f" | grep -q metadata_version || { echo '   failed to append metadata'; exit 1; }
            echo '   metadata appended'
          done
          echo 'metadata check done'

      - name: Organize files
        if: inputs.build_firmware
        id: organize
        env:
          LATEST_RELEASE: ${{ env.latest_release }}
        run: |
          rm -rf ./artifact/
          mkdir -p ./artifact/
          mv openwrt/bin/targets/${{ matrix.arch }}/${{ env.sysupgrade_glob }} ./artifact/ || true
          cd ./artifact/
          ls -Ahl
          # 不要 gunzip/regzip：镜像尾部附有 JSON metadata，gzip -d 会把它当
          # "trailing garbage" 丢掉（这也正是此前 release 里镜像 sysupgrade 报
          # "no JSON input" 的真正原因）。原样保留构建产物即可。
          for f in *; do
            case "$f" in
              *.img|*.img.gz)
                if tail -c 4096 "$f" | grep -q metadata_version; then
                  echo "metadata OK: $f"
                else
                  echo "metadata MISSING in $f"; exit 1
                fi
                ;;
            esac
          done
          ls -Ahl
          sha256sum openwrt*${{ env.sha_match }}* | tee ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}.sha256sum
          zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-ext4.zip ${{ env.ext4_zip }}
          zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-sfs.zip ${{ env.sfs_zip }}
          ls -Ahl

      - name: Upload firmware artifacts (safety net)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_prefix }}-firmware
          path: ./artifact/*.zip
          retention-days: 7

      - name: Clean stale release assets (this device)
        if: inputs.build_firmware
        env:
          PREFIX: ${{ env.artifact_prefix }}
          TAG: ${{ env.latest_release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          tok = os.environ['GITHUB_TOKEN']
          prefix = os.environ['PREFIX']
          tag = os.environ['TAG']
          def api(path, method='GET'):
              r = urllib.request.Request('https://api.github.com/repos/' + repo + path, method=method,
                  headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json',
                           'User-Agent': 'dsh'})
              with urllib.request.urlopen(r, timeout=60) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else None
          rel = api('/releases/tags/' + tag)
          if not rel:
              print('release not found, nothing to clean'); raise SystemExit(0)
          for a in rel['assets']:
              n = a['name']
              if n.startswith(prefix + '-') and n.endswith('.zip'):
                  print('deleting stale asset', n)
                  api('/releases/assets/%d' % a['id'], method='DELETE')
          PYEOF

      - name: Publish firmware to the release
        if: inputs.build_firmware
        id: create_release
        # 不再用第三方 release action：它在 token 权限受限时会 403 并中断整个构建。
        # 这里失败也不判为构建失败（artifact 已上传，可由运维脚本补发）。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.latest_release }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "OpenWrt $TAG firmware + plugins" \
              --notes "CI publishes every device firmware (ext4 / sfs) plus the footstrap theme packages (apk / ipk) in this single release." || true
          fi
          gh release upload "$TAG" ./artifact/*.zip --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Print Disk Space After
        run: df -h
