name: Seed probe (config resolution only)

# 临时诊断：只把 SEED/<device>/config.seed 解析成 .config，不编译。
# 用于确认 ip-full / tc-full 等宿主工具是否真的被 defconfig 选中。

on:
  workflow_dispatch:
    inputs:
      device:
        description: R2S / R3S / R4S / X86
        required: false
        default: 'R4S'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve seed into .config and report host tools
        run: |
          set -euo pipefail
          dev="${{ inputs.device }}"
          rel=$(curl -fLsS "https://downloads.openwrt.org/releases/" | grep -oE 'href="25\.12\.[0-9]+/"' | cut -d '"' -f2 | tr -d / | sort -Vu | tail -1)
          echo "openwrt release: $rel"
          git clone -q --depth 1 -b "v$rel" https://github.com/openwrt/openwrt openwrt
          cd openwrt
          ./scripts/feeds update -a >/dev/null 2>&1 || true
          ./scripts/feeds install -a >/dev/null 2>&1 || true
          cp "../SEED/$dev/config.seed" .config
          echo '--- seed 里与宿主工具相关的行:'
          grep -nE 'ip-full|ip-tiny|tc-full|tc-tiny|bpftool|ipset' .config || true
          make defconfig >/dev/null 2>&1 || true
          echo '--- 解析后的 .config:'
          grep -E '^#? ?CONFIG_PACKAGE_(ip-full|ip-tiny|tc-full|tc-tiny|tc-bpf|bpftool|bpftool-minimal|ipset)' .config || echo '(none)'
          echo '--- 结论:'
          if grep -q '^CONFIG_PACKAGE_ip-full=y$' .config; then echo 'ip-full SELECTED'; else echo 'ip-full NOT selected'; fi
          if grep -q '^CONFIG_PACKAGE_ip-tiny=y$' .config; then echo 'ip-tiny also selected'; fi
          if grep -q '^CONFIG_PACKAGE_tc-full=y$' .config; then echo 'tc-full SELECTED'; else echo 'tc-full NOT selected'; fi
