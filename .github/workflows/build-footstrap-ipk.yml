name: Build footstrap ipk for OpenWrt 24.10

on:
  workflow_dispatch:

jobs:
  ipk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@main
        with:
          ref: 25.12
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick 24.10 SDK
        run: |
          base=$(curl -s https://downloads.openwrt.org/releases/ | grep -oE 'href="24\.10\.[0-9]+/"' | grep -oE '24\.10\.[0-9]+' | sort -V | tail -1)
          echo "rel=$base"
          sdk=$(curl -s "https://downloads.openwrt.org/releases/${base}/targets/x86/64/" | grep -oE 'openwrt-sdk-[^"<]+\.tar\.zst' | head -1)
          echo "sdk=$sdk"
          command -v zstd >/dev/null || sudo apt-get -y -qq install zstd
          curl -sL -o sdk.tar.zst "https://downloads.openwrt.org/releases/${base}/targets/x86/64/${sdk}"
          tar --zstd -xf sdk.tar.zst
          ls -d openwrt-sdk-*/ > sdkdir

      - name: Setup feeds and package
        run: |
          sdkdir=$(cat sdkdir)
          cd $sdkdir
          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1
          # 与固件使用同一个主题提交（SCRIPTS/02_prepare_package.sh 里 pin 的那个），
          # 这样 24.10 的 ipk 与 25.12 的 apk 版本号同源，便于对照。
          commit=$(sed -nE 's/.*fetch -q --depth 1 origin ([0-9a-f]{40}).*/\1/p' ../SCRIPTS/02_prepare_package.sh)
          test "${#commit}" -eq 40
          echo "theme commit: $commit"
          rm -rf theme _t
          git init -q theme
          git -C theme remote add origin https://github.com/VizzleTF/luci-theme-footstrap
          git -C theme fetch -q --depth 1 origin "$commit"
          git -C theme checkout -q --detach FETCH_HEAD
          mkdir -p package/luci-theme-footstrap
          cp -r theme/luci-theme-footstrap/* package/luci-theme-footstrap/
          for lang in zh-cn zh_Hans; do
            mkdir -p package/luci-theme-footstrap/po/$lang
            cp ../PATCH/theme-footstrap-zh/zh_Hans/footstrap.po package/luci-theme-footstrap/po/$lang/footstrap.po
          done
          # 主题包本身不带版本元数据（本地拷贝会得到版本 0），这里按 OpenWrt 风格
          # 用固定提交的时间戳生成版本：<YY>.<年内第几天>.<时分秒>~<短 sha>
          # 例如 26.255.205539~faa0ee7，既单调递增又可直接追溯到提交。
          FOOTSTRAP_COMMIT=$(git -C theme rev-parse HEAD)
          FOOTSTRAP_VERSION="$(git -C theme show -s --format=%cd --date=format:'%y.%j.%H%M%S' "$FOOTSTRAP_COMMIT")~$(printf %.7s "$FOOTSTRAP_COMMIT")"
          echo "FOOTSTRAP_VERSION=$FOOTSTRAP_VERSION" >> "$GITHUB_ENV"
          mf=package/luci-theme-footstrap/Makefile
          if grep -q '^PKG_VERSION' "$mf"; then
            sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=$FOOTSTRAP_VERSION|" "$mf"
          else
            sed -i "/include \$(TOPDIR)\/rules.mk/a PKG_VERSION:=$FOOTSTRAP_VERSION" "$mf"
          fi
          grep -n '^PKG_VERSION' "$mf"
          echo 'CONFIG_PACKAGE_luci-theme-footstrap=y' > .config
          echo 'CONFIG_PACKAGE_luci-i18n-footstrap-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-bootstrap=n' >> .config
          make defconfig >/dev/null 2>&1

      - name: Compile ipk packages
        run: |
          sdkdir=$(cat sdkdir)
          cd $sdkdir
          # 24.10 SDK 没有 package/luci-i18n-footstrap-zh-cn/compile 目标（i18n 包由
          # luci.mk 随主题一起生成）。版本注入走主题 Makefile 原生的 FOOTSTRAP_VERSION；
          # i18n 包的版本由 luci.mk 的 `VERSION:=$(PKG_PO_VERSION)` 决定，所以必须传
          # PKG_PO_VERSION，否则 i18n 包会得到版本 0。
          FOOTSTRAP_VERSION="$FOOTSTRAP_VERSION" PKG_PO_VERSION="$FOOTSTRAP_VERSION" \
            make package/luci-theme-footstrap/compile -j$(nproc) V=s 2>&1 | tail -30
          echo '--- results ---'
          find -L bin -type f \( -name 'luci-theme-footstrap*.ipk' -o -name 'luci-i18n-*footstrap*.ipk' \) | sort

      - name: Verify ipk packages
        run: |
          set -euo pipefail
          sd=$(cat sdkdir)
          python3 - "$sd" <<'PYEOF'
          import io, os, re, sys, tarfile
          sd = sys.argv[1]
          targets = []
          for root, _dirs, files in os.walk(os.path.join(sd, 'bin')):
              for f in files:
                  if f.endswith('.ipk') and 'footstrap' in f.lower():
                      targets.append(os.path.join(root, f))
          targets.sort()
          assert targets, 'no footstrap ipk produced'

          def inner_names(blob):
              try:
                  with tarfile.open(fileobj=io.BytesIO(blob), mode='r:*') as t:
                      return t.getnames()
              except Exception:
                  return []

          bad = 0
          for path in targets:
              print('==', path)
              names = []
              try:
                  with tarfile.open(path, 'r:*') as tf:
                      for m in tf.getmembers():
                          base = os.path.basename(m.name)
                          if re.match(r'^(control|data)\.tar(\.(gz|xz|zst))?$', base):
                              fh = tf.extractfile(m)
                              if fh is not None:
                                  names += inner_names(fh.read())
              except Exception as e:
                  print('   unreadable archive:', e); bad += 1; continue
              print('   members:', len(names))
              # 主题包：要有前端静态资源；i18n 包：要有 .lmo 翻译；
              # 两者都要有 control 段元数据（ipk 叫 `control`，`.PKGINFO` 是 apk 的约定）。
              has_static = any('luci-static/footstrap' in n for n in names)
              has_lmo = any(n.endswith('.lmo') for n in names)
              has_meta = any(os.path.basename(n) in ('control', '.PKGINFO', 'conffiles') for n in names)
              base = os.path.basename(path)
              if 'i18n' in base:
                  ok = has_lmo and has_meta
              else:
                  ok = has_static and has_meta
              print('   static=%s lmo=%s meta=%s -> %s' % (has_static, has_lmo, has_meta, 'OK' if ok else 'MISSING'))
              if not ok:
                  bad += 1
                  print('   sample:', [n for n in names if 'footstrap' in n or n.endswith('.lmo') or os.path.basename(n) == 'control'][:6])
          if bad:
              raise SystemExit('VERIFY-FAIL: %d package(s) bad' % bad)
          print('VERIFY-OK')
          PYEOF

      - name: Publish ipk into the firmware release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, urllib.request, urllib.parse
          repo = os.environ['GITHUB_REPOSITORY']; tok = os.environ['GITHUB_TOKEN']
          # 所有产物（各机型固件 + 主题插件）统一发布到同一个 release
          tag = os.environ.get('RELEASE_TAG') or '25.12.5'
          sdkdir = open('sdkdir').read().strip()
          def api(path, method='GET', body=None, ctype=None, host='api.github.com'):
              headers = {'Authorization': 'Bearer ' + tok, 'User-Agent': 'dsh', 'Accept': 'application/vnd.github+json'}
              data = None
              if ctype == 'json':
                  data = json.dumps(body).encode(); headers['Content-Type'] = 'application/json'
              elif ctype:
                  data = body; headers['Content-Type'] = ctype
              r = urllib.request.Request('https://' + host + '/repos/' + repo + path, method=method, headers=headers, data=data)
              try:
                  with urllib.request.urlopen(r, timeout=300) as resp:
                      rb = resp.read()
                      return json.loads(rb) if rb else None
              except urllib.error.HTTPError as e:
                  print('HTTP', e.code, host + path, e.read()[:200]); return None
          hits = glob.glob(sdkdir + '/bin/**/*footstrap*.ipk', recursive=True)
          hits = [h for h in hits if 'luci-theme-footstrap' in os.path.basename(h) or 'zh-cn' in os.path.basename(h)]
          hits = sorted(set(hits))
          print('ipks:', hits)
          if not hits:
              raise SystemExit(1)
          rel = api('/releases/tags/' + urllib.parse.quote(tag))
          if not rel or 'id' not in rel:
              rel = api('/releases', 'POST', {'tag_name': tag, 'name': 'OpenWrt %s firmware + plugins' % tag, 'body': 'CI 统一发布：各机型固件（ext4 / sfs）+ footstrap 主题插件（apk / ipk）。', 'draft': False, 'prerelease': False}, 'json')
          rid = rel['id']
          for f in hits:
              name = os.path.basename(f)
              api('/releases/%d/assets?name=%s' % (rid, urllib.parse.quote(name)), 'POST', open(f, 'rb').read(), 'application/octet-stream', host='uploads.github.com')
              print('uploaded', name)
          PYEOF
